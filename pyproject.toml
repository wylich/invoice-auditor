[project]
name = "invoice-auditor"
version = "0.1.0"
description = "AI-Powered CFO for Danish SMEs. An intelligent, human-in-the-loop invoice auditor that handles split-VAT logic, CVR compliance, and automated data extraction."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.4",
    "httpx>=0.28.1",
    "pydantic-ai",
    "pillow",
    "pymupdf>=1.24.0",
    "pydantic-settings[toml]",
    "fastapi>=0.115.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_auditor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
